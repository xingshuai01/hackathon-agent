<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 216" width="660" height="216">
  <style>
    .t { font-family: "Segoe UI", Arial, sans-serif; fill: #1b1b1b; }
    .sm { font-family: "Segoe UI", Arial, sans-serif; fill: #5a6472; font-size: 9.5px; }
    .num { font-family: "Segoe UI", Arial, sans-serif; fill: #1b1b1b; font-size: 11px; font-weight: 600; }
    .axis { stroke: #1b1b1b; stroke-width: 1; }
    .grid { stroke: #dfe3e8; stroke-width: 0.8; }
    .bar { fill: #2b2b2b; }
    .zero { fill: none; stroke: #b9c0c9; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <text class="sm" x="60" y="14">claims</text>

  <!-- gridlines -->
  <path class="grid" d="M60 40 H620"/>
  <path class="grid" d="M60 80 H620"/>
  <path class="grid" d="M60 120 H620"/>

  <!-- y labels -->
  <text class="sm" x="48" y="44" text-anchor="end">12</text>
  <text class="sm" x="48" y="84" text-anchor="end">8</text>
  <text class="sm" x="48" y="124" text-anchor="end">4</text>
  <text class="sm" x="48" y="164" text-anchor="end">0</text>

  <!-- baseline -->
  <path class="axis" d="M60 160 H620"/>

  <!-- bars -->
  <rect class="bar" x="105" y="150" width="70" height="10"/>
  <text class="num" x="140" y="144" text-anchor="middle">1</text>

  <rect class="zero" x="240" y="150" width="70" height="10"/>
  <text class="num" x="275" y="144" text-anchor="middle">0</text>

  <rect class="bar" x="375" y="40" width="70" height="120"/>
  <text class="num" x="410" y="34" text-anchor="middle">12</text>

  <rect class="bar" x="510" y="90" width="70" height="70"/>
  <text class="num" x="545" y="84" text-anchor="middle">7</text>

  <!-- x labels -->
  <text class="t" x="140" y="176" font-size="11" text-anchor="middle">−4</text>
  <text class="t" x="275" y="176" font-size="11" text-anchor="middle">0</text>
  <text class="t" x="410" y="176" font-size="11" text-anchor="middle">+1</text>
  <text class="t" x="545" y="176" font-size="11" text-anchor="middle">+2</text>
  <text class="sm" x="330" y="194" text-anchor="middle">reported page minus real page (one paper, 20 claims)</text>
  <text class="sm" x="330" y="209" text-anchor="middle">a constant offset would put all 20 claims in a single column — none of these are correct as reported</text>
</svg>
