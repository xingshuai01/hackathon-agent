<?xml version="1.0" encoding="UTF-8"?>
<!-- 科研搭子 · 哈基米(小黑猫版)—— Q 版吉祥物静态 SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <defs>
    <radialGradient id="furGrad" cx="42%" cy="24%" r="80%">
      <stop offset="0%" stop-color="#3D3739" />
      <stop offset="60%" stop-color="#2E2A2B" />
      <stop offset="100%" stop-color="#231F20" />
    </radialGradient>
    <radialGradient id="earGrad" cx="50%" cy="18%" r="92%">
      <stop offset="0%" stop-color="#3A3436" />
      <stop offset="100%" stop-color="#282324" />
    </radialGradient>
    <radialGradient id="eyeGrad" cx="46%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#B7ECFF" />
      <stop offset="45%" stop-color="#5CC7F7" />
      <stop offset="100%" stop-color="#2C8FD6" />
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8FB0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FF8FB0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="penGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB27A" />
      <stop offset="100%" stop-color="#F0803E" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2ECE3" />
    </linearGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="200" cy="438" rx="96" ry="14" fill="#000000" opacity="0.10" />

  <!-- 大猫耳(身体之后,底部被身体盖住) -->
  <g stroke="#4A4346" stroke-width="4" stroke-linejoin="round">
    <path d="M84 178 L104 14 L190 142 Z" fill="url(#earGrad)" />
    <path d="M316 178 L296 14 L210 142 Z" fill="url(#earGrad)" />
  </g>
  <g>
    <path d="M108 158 L122 44 L172 128 Z" fill="#FFA6BF" opacity="0.92" />
    <path d="M292 158 L278 44 L228 128 Z" fill="#FFA6BF" opacity="0.92" />
  </g>

  <!-- 圆滚滚黑猫身体 -->
  <ellipse cx="200" cy="262" rx="138" ry="130" fill="url(#furGrad)" stroke="#4A4346" stroke-width="4" />
  <!-- 胸前浅色绒光,给黑猫一点层次 -->
  <ellipse cx="200" cy="300" rx="80" ry="52" fill="#4A4346" opacity="0.35" />

  <!-- 蓝眼睛 -->
  <g>
    <ellipse cx="150" cy="248" rx="23" ry="28" fill="url(#eyeGrad)" />
    <circle cx="142" cy="236" r="8.5" fill="#FFFFFF" />
    <circle cx="158" cy="258" r="4" fill="#FFFFFF" opacity="0.7" />
    <ellipse cx="250" cy="248" rx="23" ry="28" fill="url(#eyeGrad)" />
    <circle cx="242" cy="236" r="8.5" fill="#FFFFFF" />
    <circle cx="258" cy="258" r="4" fill="#FFFFFF" opacity="0.7" />
  </g>

  <!-- 方框眼镜 -->
  <g fill="none" stroke="#C39A5E" stroke-width="5">
    <rect x="118" y="216" width="64" height="64" rx="13" fill="rgba(140,200,255,0.08)" />
    <rect x="218" y="216" width="64" height="64" rx="13" fill="rgba(140,200,255,0.08)" />
    <path d="M182 242 Q200 234 218 242" stroke-linejoin="round" />
    <path d="M118 238 L98 230" stroke-linecap="round" />
    <path d="M282 238 L302 230" stroke-linecap="round" />
  </g>
  <!-- 镜片反光 -->
  <g stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" opacity="0.75">
    <path d="M132 258 l16 -18" />
    <path d="M232 258 l16 -18" />
  </g>

  <!-- 腮红 -->
  <ellipse cx="98" cy="292" rx="24" ry="14" fill="url(#cheekGrad)" />
  <ellipse cx="302" cy="292" rx="24" ry="14" fill="url(#cheekGrad)" />

  <!-- w 猫嘴(黑猫上用粉色,衬得出来) -->
  <path d="M186 300 Q193 311 200 302 Q207 311 214 300" fill="none" stroke="#FFB0C6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 纸(带横线) -->
  <g transform="rotate(-7 200 392)">
    <rect x="140" y="352" width="122" height="84" rx="6" fill="url(#paperGrad)" stroke="#D9C9BC" stroke-width="2.5" />
    <g stroke="#CFE4F5" stroke-width="3" stroke-linecap="round">
      <path d="M154 374 H250" />
      <path d="M154 392 H250" />
      <path d="M154 410 H226" />
    </g>
    <!-- 折角 -->
    <path d="M262 352 L262 376 L238 352 Z" fill="#E7DED2" />
  </g>

  <!-- 左爪:按在纸上 -->
  <ellipse cx="156" cy="368" rx="17" ry="13" fill="url(#earGrad)" stroke="#4A4346" stroke-width="3" />

  <!-- 笔(斜指纸面) -->
  <g>
    <path d="M256 320 L214 384 L206 378 L248 314 Z" fill="url(#penGrad)" stroke="#B65E2A" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M214 384 L206 378 L200 390 Z" fill="#C9CDD2" stroke="#9AA0A6" stroke-width="1" stroke-linejoin="round" />
    <path d="M248 314 L256 320 L262 311 L254 305 Z" fill="#FFD9BF" stroke="#B65E2A" stroke-width="1" stroke-linejoin="round" />
  </g>

  <!-- 右爪:握笔 -->
  <ellipse cx="246" cy="338" rx="17" ry="13" fill="url(#earGrad)" stroke="#4A4346" stroke-width="3" />

  <!-- 闪光点缀 -->
  <g>
    <path d="M64 132 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#FFD86B" />
    <path d="M338 168 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#A8D8FF" />
    <path d="M78 380 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#FFB3C7" />
    <path d="M326 356 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#C4B5FD" />
  </g>
</svg>
